name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # BUILD LINUX (AppImage)
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libfuse2 libxss1 \
            python3 python3-pip build-essential

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Guru (Linux)
        run: npm run build:guru:linux

      - name: Build Siswa (Linux)
        run: npm run build:siswa:linux

      - name: List build output
        if: always()
        run: |
          echo "=== dist/ structure ==="
          find dist -type f 2>/dev/null | head -40 || echo "No dist directory"
          echo "=== node_modules/.bin/quasar ==="
          ls -la node_modules/.bin/quasar 2>/dev/null || echo "quasar not found in .bin"
          echo "=== electron version ==="
          cat node_modules/electron/package.json 2>/dev/null | grep '"version"' || echo "electron not installed"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/electron/*.AppImage
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUILD WINDOWS (NSIS Installer)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Guru (Windows)
        run: npm run build:guru:win

      - name: Build Siswa (Windows)
        run: npm run build:siswa:win

      - name: List build output
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse dist/electron -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/electron/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUILD MACOS (DMG — Apple Silicon arm64)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Guru (macOS)
        run: npm run build:guru:mac

      - name: Build Siswa (macOS)
        run: npm run build:siswa:mac

      - name: List build output
        if: always()
        run: find dist/electron -maxdepth 3 -type f 2>/dev/null || echo "No dist/electron directory found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/electron/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUAT GITHUB RELEASE
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download semua artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f || echo "No artifacts found"

      - name: Buat GitHub Release dan upload installer
        uses: softprops/action-gh-release@v2
        with:
          name: "Sios CBE ${{ github.ref_name }}"
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: false
