name: Build & Release

# Trigger 1: otomatis saat push tag v*.*.* (misal: v1.0.0)
# Trigger 2: manual dari tab Actions di GitHub
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nama release (misal: v1.0.0)'
        required: false
        default: 'dev-build'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # BUILD LINUX (AppImage)
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libfuse2 libgconf-2-4 libxss1

      - name: Install npm dependencies
        run: npm ci

      - name: Build Guru (Linux)
        run: npm run build:guru:linux

      - name: Build Siswa (Linux)
        run: npm run build:siswa:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/electron/*.AppImage
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUILD WINDOWS (NSIS Installer)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Guru (Windows)
        run: npm run build:guru:win

      - name: Build Siswa (Windows)
        run: npm run build:siswa:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/electron/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUILD MACOS (DMG — Apple Silicon arm64)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-14  # Apple Silicon M1 runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Guru (macOS)
        run: npm run build:guru:mac

      - name: Build Siswa (macOS)
        run: npm run build:siswa:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/electron/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # BUAT GITHUB RELEASE + UPLOAD SEMUA INSTALLER
  # Hanya jalan saat trigger dari tag (v*.*.*)
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download semua artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Buat GitHub Release dan upload installer
        uses: softprops/action-gh-release@v2
        with:
          name: "Sios CBE ${{ github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
